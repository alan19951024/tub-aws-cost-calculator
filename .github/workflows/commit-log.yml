name: 自動產生 Commit 更新日誌

on:
  push:
    branches:
      - '**'

jobs:
  generate-log:
    runs-on: ubuntu-latest

    # 避免 bot 自動 commit 觸發無限迴圈
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
