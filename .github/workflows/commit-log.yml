name: 自動產生 Commit 更新日誌

on:
  push:
    branches:
      - '**'

jobs:
  generate-log:
    runs-on: ubuntu-latest

    # 避免 bot 自動 commit 觸發無限迴圈
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Collect commit information
        id: info
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "full_sha=$(git rev-parse HEAD)"           >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)"       >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=%ci)"         >> $GITHUB_OUTPUT

          # 完整 commit message（含 body）
          git log -1 --pretty=%B > /tmp/commit_message.txt

          # 變更統計（檔案新增/刪除行數）
          git diff HEAD~1 HEAD --stat > /tmp/diff_stat.txt

          # 變更檔案清單（含狀態：A=新增 M=修改 D=刪除）
          git diff HEAD~1 HEAD --name-status > /tmp/changed_files.txt

          # 實際 diff 內容（限 300 行，避免超過 token 限制）
          git diff HEAD~1 HEAD | head -300 > /tmp/diff_content.txt

      - name: Generate update log with Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMMIT_SHORT_SHA: ${{ steps.info.outputs.short_sha }}
          COMMIT_FULL_SHA:  ${{ steps.info.outputs.full_sha }}
          COMMIT_AUTHOR:    ${{ steps.info.outputs.author }}
          COMMIT_DATE:      ${{ steps.info.outputs.date }}
          BRANCH_NAME:      ${{ github.ref_name }}
          REPO_NAME:        ${{ github.repository }}
        run: python scripts/generate_log.py

      - name: Commit and push COMMIT_LOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add COMMIT_LOG.md
          # 若沒有任何變更就不 commit（避免空 commit）
          git diff --staged --quiet || \
            git commit -m "docs: auto-update commit log [${{ steps.info.outputs.short_sha }}] [skip ci]"
          git push
